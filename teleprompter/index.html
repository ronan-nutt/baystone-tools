<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Teleprompter</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0b0d;color:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
button{font:inherit;color:inherit;border:0;border-radius:14px;background:#26262c;padding:12px 16px;min-height:48px;cursor:pointer}
button:active{opacity:.7}
.primary{background:#3b82f6;font-weight:600}
.rec{background:#ef4444;font-weight:600}
/* editor */
#editor{padding:16px;gap:12px}
#editor h1{font-size:20px;margin:4px 0 0}
#editor p{margin:0;color:#9a9aa6;font-size:14px}
#script{flex:1;width:100%;resize:none;border:1px solid #33333b;border-radius:14px;background:#15151a;color:#f4f4f6;padding:14px;font-size:18px;line-height:1.5;font-family:inherit;outline:none}
#script:focus{border-color:#3b82f6}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
/* prompter */
#prompter{background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#000}
#shade{position:absolute;inset:0;background:rgba(0,0,0,.55);pointer-events:none}
#viewport{position:absolute;inset:0;overflow:hidden;touch-action:none}
#stage{position:absolute;left:0;right:0;top:0}
#stage.mirror{transform:scaleX(-1)}
#txt{padding:36vh 22px 70vh;font-weight:700;line-height:1.35;text-align:center;white-space:pre-wrap;word-wrap:break-word;text-shadow:0 2px 8px rgba(0,0,0,.8);will-change:transform}
#marker{position:absolute;left:0;right:0;top:36vh;height:0;border-top:2px solid rgba(59,130,246,.9);pointer-events:none}
#marker:before{content:"";position:absolute;left:0;top:-8px;border:8px solid transparent;border-left-color:#3b82f6}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:5}
#top button{min-height:40px;padding:8px 14px;background:rgba(30,30,36,.8)}
#timer{font-variant-numeric:tabular-nums;background:rgba(30,30,36,.8);padding:8px 14px;border-radius:14px;font-weight:600}
#timer.live{background:#ef4444}
#bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;gap:8px;z-index:5;background:linear-gradient(transparent,rgba(0,0,0,.75))}
#bar .row button{padding:8px;min-height:44px;background:rgba(40,40,48,.9)}
#bar .row .val{flex:0 0 52px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;color:#c8c8d2}
#bar .main{display:flex;gap:10px}
#bar .main button{flex:1;min-height:56px;font-size:17px}
#res{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 58px);text-align:center;font-size:11px;color:rgba(255,255,255,.55);z-index:5;pointer-events:none;font-variant-numeric:tabular-nums}
#notice{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 60px);z-index:6;background:rgba(20,20,26,.95);border:1px solid #3b3b46;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;display:none}
#notice.on{display:block}
#count{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:140px;font-weight:800;z-index:7;background:rgba(0,0,0,.45)}
#count.on{display:flex}
/* review */
#review{padding:16px;gap:12px;align-items:stretch}
#review video{flex:1;min-height:0;width:100%;background:#000;border-radius:14px;object-fit:contain}
#review p{margin:0;color:#9a9aa6;font-size:13px;line-height:1.4}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.head h1{font-size:20px;margin:0}
.sub{margin:0;color:#9a9aa6;font-size:13px;line-height:1.4}
button.big{min-height:56px;font-size:17px}
button:disabled{opacity:.4}
/* takes */
#takes{padding:16px;gap:10px}
#list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;grid-auto-rows:max-content}
.take{background:#15151a;border:2px solid #2a2a31;border-radius:14px;overflow:hidden}
.take.sel{border-color:#3b82f6}
.take video{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#000}
.take .meta{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px;font-size:14px;cursor:pointer;min-height:48px}
.take .meta small{color:#9a9aa6}
.take .chk{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #666;display:flex;align-items:center;justify-content:center;font-size:15px;color:transparent}
.take.sel .chk{background:#3b82f6;border-color:#3b82f6;color:#fff}
#list .empty{grid-column:1/-1;color:#9a9aa6;text-align:center;margin-top:40px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit;border-radius:14px;background:#3b82f6;font-weight:600;min-height:48px;padding:12px 16px}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
</style>
</head>
<body>

<div id="editor" class="screen on">
  <h1>Teleprompter</h1>
  <p>Paste your script, then tap Start.</p>
  <textarea id="script" placeholder="Paste your script here" spellcheck="false"></textarea>
  <div class="row"><button id="clear">Clear</button><button id="openTakes" style="display:none">Takes</button><button id="start" class="primary">Start</button></div>
</div>

<div id="prompter" class="screen">
  <video id="cam" playsinline muted autoplay></video>
  <div id="shade"></div>
  <div id="viewport"><div id="stage"><div id="txt"></div></div></div>
  <div id="marker"></div>
  <div id="top"><button id="edit">Edit script</button><div id="timer">00:00</div><button id="flip">Flip camera</button></div>
  <div id="res"></div>
  <div id="notice"></div>
  <div id="count"></div>
  <div id="bar">
    <div class="row">
      <button id="slower">Slower</button><div class="val" id="spdVal">5</div><button id="faster">Faster</button>
      <button id="smaller">A-</button><div class="val" id="sizeVal">40</div><button id="bigger">A+</button>
    </div>
    <div class="main">
      <button id="play">Play</button>
      <button id="recBtn" class="rec">Record</button>
      <button id="restart">Restart</button>
      <button id="mirror">Mirror</button>
    </div>
  </div>
</div>

<div id="review" class="screen">
  <div class="head"><h1 id="takeLbl">Take 1</h1><span class="sub">Kept in this browser</span></div>
  <video id="out" controls playsinline></video>
  <button id="again" class="rec big">Record another take</button>
  <div class="row"><a id="dl" class="btn" download="recording">Save video</a><button id="share" style="display:none">Share</button></div>
  <div class="row"><button id="delTake">Delete this take</button><button id="allTakes">All takes (1)</button></div>
  <button id="back">Back to script</button>
</div>

<div id="takes" class="screen">
  <div class="head"><h1>Your takes</h1><button id="selAll">Select all</button></div>
  <p class="sub">Tap a take's name to select it. Takes stay in this browser until you delete them, so save the keepers to your phone.</p>
  <div id="list"></div>
  <div class="row"><button id="saveSel" class="primary">Save selected</button><button id="delSel">Delete selected</button></div>
  <div class="row"><button id="takesRec" class="rec">Record another take</button><button id="takesBack">Back to script</button></div>
</div>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var screens=['editor','prompter','review','takes'];
function show(n){screens.forEach(function(s){$(s).classList.toggle('on',s===n)})}
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// state
var pos=0,playing=false,last=0,speedLvl=5,size=40,mirror=false;
var stream=null,facing='user',rec=null,chunks=[],recording=false,t0=0,tick=null,mime='';
var wake=null,url=null,blobOut=null;

var script=$('script');
script.value=store.get('tp_script')||'';
script.addEventListener('input',function(){store.set('tp_script',script.value)});
$('clear').onclick=function(){script.value='';store.set('tp_script','');script.focus()};

// scroll engine
var txt=$('txt'),stage=$('stage'),vp=$('viewport');
function maxPos(){return Math.max(0,txt.offsetHeight-window.innerHeight*0.5)}
function render(){stage.style.transform=(mirror?'scaleX(-1) ':'')+'translateY('+(-pos)+'px)'}
function frame(ts){
  if(playing&&!drag){
    if(last){pos+=(ts-last)/1000*speedLvl*12}
    var m=maxPos();
    if(pos>=m){pos=m;setPlaying(false)}
    render();
  }
  last=ts;requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function setPlaying(p){playing=p;$('play').textContent=p?'Pause':'Play'}
function applySize(){txt.style.fontSize=size+'px';$('sizeVal').textContent=size;render()}
function applySpeed(){$('spdVal').textContent=speedLvl}
function applyMirror(){stage.classList.remove('mirror');render();$('mirror').style.background=mirror?'#3b82f6':''}
$('slower').onclick=function(){speedLvl=Math.max(1,speedLvl-1);applySpeed()};
$('faster').onclick=function(){speedLvl=Math.min(20,speedLvl+1);applySpeed()};
$('smaller').onclick=function(){size=Math.max(20,size-4);applySize()};
$('bigger').onclick=function(){size=Math.min(96,size+4);applySize()};
$('mirror').onclick=function(){mirror=!mirror;applyMirror()};
$('play').onclick=function(){setPlaying(!playing)};

// drag the script with a finger or mouse; tap to play/pause.
// Auto-scroll holds still while the finger is down, then carries on from
// wherever the script was left.
var drag=null;
vp.addEventListener('pointerdown',function(e){
  drag={id:e.pointerId,y:e.clientY,start:e.clientY,moved:false};
  try{vp.setPointerCapture(e.pointerId)}catch(err){}
});
vp.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dy=drag.y-e.clientY;drag.y=e.clientY;
  if(!drag.moved&&Math.abs(e.clientY-drag.start)>6)drag.moved=true;
  if(drag.moved){pos=Math.min(maxPos(),Math.max(0,pos+dy));render()}
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  var d=drag;drag=null;
  if(e.type==='pointercancel')return;
  if(!d.moved)setPlaying(!playing);
  else if(recording&&!playing&&pos<maxPos())setPlaying(true);
}
vp.addEventListener('pointerup',endDrag);
vp.addEventListener('pointercancel',endDrag);

// wake lock
function lock(){try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(w){wake=w}).catch(function(){})}}catch(e){}}
function unlock(){try{if(wake){wake.release();wake=null}}catch(e){}}

// notice
function note(msg){var n=$('notice');if(!msg){n.classList.remove('on');return}n.innerHTML=msg;n.classList.add('on')}

// camera
function stopStream(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function startCam(){
  stopStream();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail();return Promise.resolve(false)}
  return navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:true}).then(function(s){
    stream=s;var v=$('cam');v.srcObject=s;v.style.transform=facing==='user'?'scaleX(-1)':'none';
    v.play&&v.play().catch(function(){});note('');
    return waitDims().then(function(){return uprightFeed(s)}).then(function(){return true});
  }).catch(function(){camFail();return false});
}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function waitDims(){var v=$('cam'),n=0;return new Promise(function(r){(function chk(){if((v.videoWidth&&v.videoHeight)||n++>60)return r();setTimeout(chk,50)})()})}
function showRes(){var v=$('cam');$('res').textContent=v.videoWidth?('camera '+v.videoWidth+'×'+v.videoHeight):''}
$('cam').addEventListener('resize',showRes);
$('cam').addEventListener('loadedmetadata',showRes);
// Phone upright but camera sending a sideways (landscape) feed: ask it for an
// upright feed so the whole sensor width is used instead of a zoomed crop.
function uprightFeed(s){
  var v=$('cam'),tr=s.getVideoTracks()[0];
  if(window.innerHeight<=window.innerWidth||!tr||!tr.applyConstraints)return Promise.resolve();
  var tries=[
    {facingMode:facing,width:{ideal:1080},height:{ideal:1920}},
    {facingMode:facing,aspectRatio:{exact:9/16}},
    {facingMode:facing,width:{exact:1080},height:{exact:1920}},
    {facingMode:facing,width:{exact:720},height:{exact:1280}}
  ],i=0;
  function upright(){return v.videoHeight>v.videoWidth}
  function next(){
    if(stream!==s||upright())return Promise.resolve();
    if(i>=tries.length){
      // Nothing worked: go back to the sharpest landscape feed for the crop.
      return tr.applyConstraints({facingMode:facing,width:{ideal:1920},height:{ideal:1080}}).catch(function(){}).then(function(){return wait(400)});
    }
    return tr.applyConstraints(tries[i++]).catch(function(){}).then(function(){return wait(400)}).then(next);
  }
  return next().then(showRes);
}
function camFail(){
  note('The camera is blocked in this view, so recording is unavailable here. The teleprompter still works. Open this page in Safari or Chrome to try again, or record with the phone camera: <label class="file" style="display:inline-block;margin-top:8px;border-radius:10px;background:#3b82f6;padding:8px 12px;font-weight:600">Open camera app<input id="nativeCam" type="file" accept="video/*" capture="user"></label>');
  var nc=$('nativeCam');
  if(nc)nc.onchange=function(){if(nc.files&&nc.files[0]){var f=nc.files[0];stopRec(true);showReview(addTake(f,f.type||'video/mp4',0))}};
}
$('flip').onclick=function(){facing=facing==='user'?'environment':'user';startCam()};

// enter prompter (returns the startCam promise, or null if there's no script)
function enterPrompter(){
  var s=script.value.trim();
  if(!s){show('editor');script.focus();return null}
  txt.textContent=s;pos=0;setPlaying(false);applySize();applySpeed();applyMirror();
  show('prompter');lock();
  $('timer').textContent='00:00';
  return startCam();
}
$('start').onclick=enterPrompter;
$('edit').onclick=function(){
  if(recording)stopRec(true);
  setPlaying(false);stopStream();unlock();show('editor');
};

// timer
function fmt(ms){var s=Math.floor(ms/1000),m=Math.floor(s/60);s=s%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function startTimer(){t0=Date.now();$('timer').classList.add('live');tick=setInterval(function(){$('timer').textContent=fmt(Date.now()-t0)},250)}
function stopTimer(){clearInterval(tick);$('timer').classList.remove('live')}

// recording
function pickMime(){
  var c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  if(!window.MediaRecorder)return null;
  for(var i=0;i<c.length;i++){if(MediaRecorder.isTypeSupported(c[i]))return c[i]}
  return '';
}
function countdown(cb){
  var n=3,el=$('count');el.textContent=n;el.classList.add('on');
  var iv=setInterval(function(){n--;if(n<=0){clearInterval(iv);el.classList.remove('on');cb()}else el.textContent=n},1000);
}
$('recBtn').onclick=function(){
  if(recording){stopRec(false);return}
  if(!stream){startCam().then(function(ok){if(ok)beginCountdown()});return}
  beginCountdown();
};
function beginCountdown(){
  var m=pickMime();
  if(m===null){note('This browser cannot record video here. You can still use the teleprompter.');return}
  mime=m;pos=0;render();setPlaying(false);
  countdown(startRec);
}
// When the phone is upright but the camera hands us a landscape feed, record
// the centre 9:16 crop the preview shows instead of the raw landscape frame.
var crop=null;
function recordStream(){
  var v=$('cam'),vw=v.videoWidth,vh=v.videoHeight;
  var portrait=window.innerHeight>window.innerWidth;
  if(!portrait||!vw||!vh||vh>=vw)return stream;
  var c=document.createElement('canvas');
  if(!c.captureStream)return stream;
  var cw=Math.round(vh*9/16/2)*2;
  c.width=cw;c.height=vh;
  var ctx=c.getContext('2d'),sx=(vw-cw)/2,alive=true;
  (function draw(){if(!alive)return;try{ctx.drawImage(v,sx,0,cw,vh,0,0,cw,vh)}catch(e){}requestAnimationFrame(draw)})();
  var out=c.captureStream(30);
  stream.getAudioTracks().forEach(function(t){out.addTrack(t)});
  crop={stop:function(){alive=false;out.getVideoTracks().forEach(function(t){t.stop()})}};
  return out;
}
function stopCrop(){if(crop){crop.stop();crop=null}}
function startRec(){
  chunks=[];stopCrop();
  var src=recordStream();
  try{rec=mime?new MediaRecorder(src,{mimeType:mime}):new MediaRecorder(src)}catch(e){stopCrop();note('Recording could not start on this device.');return}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=function(){
    stopCrop();
    var type=(rec.mimeType||mime||'video/mp4').split(';')[0];
    var b=new Blob(chunks,{type:type});
    if(b.size>0)showReview(addTake(b,type,recDur));
  };
  rec.start(1000);recording=true;
  $('recBtn').textContent='Stop';startTimer();setPlaying(true);
}
// Restart: while recording, throw the take away and start a fresh one from
// the top (with the countdown). Otherwise just jump the script back to the top.
$('restart').onclick=function(){
  if($('count').classList.contains('on'))return;
  $('timer').textContent='00:00';
  if(recording){stopRec(true);beginCountdown();return}
  pos=0;render();setPlaying(false);
};
var recDur=0;
function stopRec(silent){
  if(recording)recDur=Date.now()-t0;
  recording=false;setPlaying(false);stopTimer();$('recBtn').textContent='Record';
  if(silent){rec&&(rec.onstop=null);stopCrop()}
  try{rec&&rec.state!=='inactive'&&rec.stop()}catch(e){}
}

// takes: every finished recording is kept in this browser (IndexedDB, so a
// reload doesn't lose them) until it's deleted.
var takes=[],db=null,sel={},current=null;
function dbOpen(){return new Promise(function(res){
  try{var r=indexedDB.open('teleprompter',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('takes',{keyPath:'id'})};
    r.onsuccess=function(){db=r.result;res()};r.onerror=function(){res()};
  }catch(e){res()}
})}
function dbPut(t){if(!db)return;try{db.transaction('takes','readwrite').objectStore('takes').put({id:t.id,n:t.n,blob:t.blob,type:t.type,created:t.created,dur:t.dur})}catch(e){}}
function dbDel(id){if(!db)return;try{db.transaction('takes','readwrite').objectStore('takes').delete(id)}catch(e){}}
function dbAll(){return new Promise(function(res){
  if(!db)return res([]);
  try{var q=db.transaction('takes').objectStore('takes').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}
})}
dbOpen().then(dbAll).then(function(a){
  a.sort(function(x,y){return x.created-y.created});
  takes=a.concat(takes.filter(function(t){return !a.some(function(s){return s.id===t.id})}));
  counts();
});
function addTake(blob,type,dur){
  var n=takes.reduce(function(m,t){return Math.max(m,t.n)},0)+1,now=Date.now();
  var t={id:now+'-'+n,n:n,blob:blob,type:type,created:now,dur:dur||0};
  takes.push(t);dbPut(t);counts();
  return t;
}
function removeTake(t){
  takes=takes.filter(function(x){return x!==t});delete sel[t.id];
  if(t.url)URL.revokeObjectURL(t.url);
  dbDel(t.id);counts();
}
function extFor(type){return type.indexOf('webm')>-1?'webm':(type.indexOf('quicktime')>-1?'mov':'mp4')}
function nameFor(t){return 'take-'+t.n+'-'+t.created+'.'+extFor(t.type)}
function urlFor(t){if(!t.url)t.url=URL.createObjectURL(t.blob);return t.url}
function fileFor(t){try{return new File([t.blob],nameFor(t),{type:t.type})}catch(e){return null}}
function counts(){
  $('allTakes').textContent='All takes ('+takes.length+')';
  var o=$('openTakes');o.style.display=takes.length?'':'none';o.textContent='Takes ('+takes.length+')';
}
// Save several at once: the share sheet on phones (lets you "Save Videos" to
// Photos in one go), otherwise one download per take.
function saveTakes(list){
  var files=list.map(fileFor).filter(Boolean);
  try{if(navigator.canShare&&files.length&&navigator.canShare({files:files})){navigator.share({files:files}).catch(function(){});return}}catch(e){}
  list.forEach(function(t,i){setTimeout(function(){
    var a=document.createElement('a');a.href=urlFor(t);a.download=nameFor(t);document.body.appendChild(a);a.click();a.remove();
  },i*500)});
}

// review (the take that just finished)
function showReview(t){
  current=t;
  $('takeLbl').textContent='Take '+t.n+(t.dur?' · '+fmt(t.dur):'');
  $('out').src=urlFor(t);
  var d=$('dl');d.href=urlFor(t);d.download=nameFor(t);
  var f=fileFor(t),canShare=false;
  try{canShare=!!(f&&navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
  $('share').onclick=function(){navigator.share({files:[f]}).catch(function(){})};
  $('share').style.display=canShare?'block':'none';
  setPlaying(false);stopRec(true);stopStream();unlock();
  show('review');
}
function recordAnother(){
  $('out').pause();
  var p=enterPrompter();
  if(p)p.then(function(ok){if(ok)beginCountdown()});
}
$('again').onclick=recordAnother;
$('delTake').onclick=function(){
  if(!current||!confirm('Delete Take '+current.n+'? This can\'t be undone.'))return;
  $('out').pause();$('out').removeAttribute('src');
  removeTake(current);current=null;
  if(takes.length)openTakes();else enterPrompter();
};
$('allTakes').onclick=function(){$('out').pause();openTakes()};
$('back').onclick=function(){$('out').pause();show('editor')};

// all takes
function openTakes(){
  setPlaying(false);if(recording)stopRec(true);stopStream();unlock();
  renderTakes();show('takes');
}
function renderTakes(){
  var list=$('list');list.innerHTML='';
  if(!takes.length){list.innerHTML='<p class="empty">No takes yet.</p>'}
  takes.slice().reverse().forEach(function(t){
    var card=document.createElement('div');card.className='take'+(sel[t.id]?' sel':'');
    var v=document.createElement('video');
    v.src=urlFor(t)+'#t=0.1';v.controls=true;v.preload='metadata';v.playsInline=true;v.setAttribute('playsinline','');
    var m=document.createElement('div');m.className='meta';
    m.innerHTML='<span><b>Take '+t.n+'</b>'+(t.dur?' <small>'+fmt(t.dur)+'</small>':'')+'</span><span class="chk">✓</span>';
    m.onclick=function(){if(sel[t.id])delete sel[t.id];else sel[t.id]=true;card.classList.toggle('sel',!!sel[t.id]);selUI()};
    card.appendChild(v);card.appendChild(m);list.appendChild(card);
  });
  selUI();
}
function chosen(){return takes.filter(function(t){return sel[t.id]})}
function selUI(){
  var k=chosen().length,all=takes.length&&k===takes.length;
  $('saveSel').textContent='Save selected'+(k?' ('+k+')':'');
  $('delSel').textContent='Delete selected'+(k?' ('+k+')':'');
  $('saveSel').disabled=$('delSel').disabled=!k;
  $('selAll').textContent=all?'Select none':'Select all';
  $('selAll').style.visibility=takes.length?'':'hidden';
}
$('selAll').onclick=function(){
  var all=chosen().length===takes.length;sel={};
  if(!all)takes.forEach(function(t){sel[t.id]=true});
  renderTakes();
};
$('saveSel').onclick=function(){var c=chosen();if(c.length)saveTakes(c)};
$('delSel').onclick=function(){
  var c=chosen();if(!c.length)return;
  if(!confirm('Delete '+c.length+' take'+(c.length>1?'s':'')+'? This can\'t be undone.'))return;
  c.forEach(removeTake);renderTakes();
};
$('takesRec').onclick=recordAnother;
$('takesBack').onclick=function(){show('editor')};
$('openTakes').onclick=openTakes;
})();
</script>
</body>
